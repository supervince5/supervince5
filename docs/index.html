<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Vincent's Piano</title><meta name="description" content="An interactive piano with rainbow tile ripples."><link rel="stylesheet" href="style.css?v=melody-1"></head>
<body><a class="social" href="https://www.tiktok.com/@musicbyvince" target="_blank" rel="noopener noreferrer">TikTok ↗</a><main><img class="vinceway-logo" src="vinceway-logo.svg" alt="Vinceway &amp; Sons"><section class="practice" aria-label="Melody typing game"><div class="practice-bar"><div><button id="practice-toggle" aria-pressed="false">play love.</button><span class="song-title">love. · wave to earth</span><span class="score-range">1–9</span></div><div><button id="listen" aria-pressed="false">listen</button><button id="restart">restart</button></div></div><div id="lesson" hidden><div id="prompt" tabindex="0" role="group" aria-label="Type the highlighted letter to play the melody"></div><div class="practice-meta"><span id="progress" aria-live="polite">0 / 49</span><span id="feedback">type the highlighted letter</span><span id="accuracy">100% accuracy</span></div></div></section><section class="instrument" aria-label="Interactive piano"><div class="stage"><canvas id="tiles" aria-hidden="true"></canvas></div><div class="fallboard"></div><div class="keys" id="keys" role="group" aria-label="Piano keys, A3 through A6"></div><div class="rim"></div></section><a class="back" href="https://github.com/supervince5">back to my GitHub</a></main><script src="piano.js?v=melody-1"></script></body></html>
